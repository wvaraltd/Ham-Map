<VirtualHost *:80>
    ServerName 192.168.1.69
    DocumentRoot /var/www/hammap

    <Directory /var/www/hammap>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:3100/api/ connectiontimeout=5 timeout=30
    ProxyPassReverse /api/ http://127.0.0.1:3100/api/

    ErrorLog ${APACHE_LOG_DIR}/hammap-error.log
    CustomLog ${APACHE_LOG_DIR}/hammap-access.log combined

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "geolocation=(self)"
    </IfModule>
</VirtualHost>
